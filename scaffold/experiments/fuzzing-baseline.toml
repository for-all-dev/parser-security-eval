name = "fuzzing-baseline"
description = "Baseline fuzzing runs across targets with varying durations"
task = "fuzzing"
output_dir = "results/fuzzing-baseline-v2"
repetitions = 1

[defaults]
targets_root = "../targets"
engine = "libfuzzer"
message_limit = 120
max_rounds = 3
round_duration = 60

[grid]
model = ["anthropic/claude-sonnet-5", "openai/gpt-5.4-mini", "anthropic/claude-opus-5"]
target = ["libpng", "libjpeg-turbo", "libxml2", "zlib"]

[grid.extra]
fuzz_duration = [60, 120, 300]
