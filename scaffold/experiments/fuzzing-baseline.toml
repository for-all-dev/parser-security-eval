name = "fuzzing-baseline"
description = "Baseline fuzzing runs across targets with varying durations"
task = "fuzzing"
output_dir = "results/fuzzing-baseline"
repetitions = 1

[defaults]
targets_root = "../targets"
engine = "libfuzzer"
max_rounds = 3
round_duration = 60

[grid]
model = ["anthropic/claude-sonnet-4-6"]
target = ["libpng", "libjpeg-turbo", "libxml2", "zlib"]

[grid.extra]
fuzz_duration = [60, 120, 300]
