[project]
name = "parser-security-eval"
version = "0.1.0"
description = "Parser security evaluation framework: AI agents attack and defend parsers"
readme = "README.md"
authors = [
    { name = "Quinn Dougherty", email = "quinn@for-all.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.84.0",
    "inspect-ai>=0.3.184",
    "jinja2>=3.1.6",
    "logfire>=4.36.0",
    "openai>=2.30.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "pydantic>=2.12.5",
    "pydantic-ai-slim[anthropic,openai]>=2.0.0",
    "pyyaml>=6.0",
    "rich>=14.3.3",
    "streamlit>=1.36.0",
    "typer>=0.24.1",
]

[project.scripts]
parser-security-eval = "parser_security_eval:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.logfire]
# Loop telemetry degrades to a silent no-op when Logfire isn't configured
# (no token / unit tests) instead of warning on every span/log call.
ignore_no_config = true

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "ty>=0.0.19",
]
