<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="719" height="267" rx="10" fill="#fcfcfb" stroke="#e6e5e1"/>

  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Memory-safety bugs found, by setting</text>
  <text x="28" y="54" font-size="12.5" fill="#52514e">Equal fuzzing walltime per target. On soft targets the bare fuzzer finds the most.</text>

  <!-- legend -->
  <rect x="500" y="24" width="11" height="11" rx="2.5" fill="#2a78d6"/>
  <text x="516" y="33" font-size="11.5" fill="#52514e">LLM involved</text>
  <rect x="600" y="24" width="11" height="11" rx="2.5" fill="#eb6834"/>
  <text x="616" y="33" font-size="11.5" fill="#52514e">no LLM at all</text>

  <!-- gridlines 0,5,10,15 ; x = 250 + v*28 -->
  <g stroke="#ededea" stroke-width="1">
    <line x1="250" y1="80" x2="250" y2="210"/>
    <line x1="390" y1="80" x2="390" y2="210"/>
    <line x1="530" y1="80" x2="530" y2="210"/>
    <line x1="670" y1="80" x2="670" y2="210"/>
  </g>
  <g font-size="10.5" fill="#8a8983" text-anchor="middle">
    <text x="250" y="226">0</text>
    <text x="390" y="226">5</text>
    <text x="530" y="226">10</text>
    <text x="670" y="226">15</text>
  </g>
  <text x="460" y="248" font-size="11" fill="#8a8983" text-anchor="middle">distinct memory-safety crashes</text>

  <!-- baseline axis -->
  <line x1="250" y1="80" x2="250" y2="210" stroke="#c9c8c4" stroke-width="1.5"/>

  <!-- Row 1: OSS-Fuzz hybrid = 0 -->
  <text x="238" y="98" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">OSS-Fuzz targets</text>
  <text x="238" y="112" font-size="10.5" fill="#8a8983" text-anchor="end">hybrid (LLM writes harness)</text>
  <text x="258" y="105" font-size="12.5" font-weight="700" fill="#8a8983">0</text>

  <!-- Row 2: tree-sitter hybrid = 10 -> width 280 -->
  <text x="238" y="145" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">tree-sitter grammars</text>
  <text x="238" y="159" font-size="10.5" fill="#8a8983" text-anchor="end">LLM-scaffolded survey (no LLM in loop)</text>
  <rect x="250" y="133" width="280" height="26" rx="4" fill="#2a78d6"/>
  <text x="542" y="151" font-size="13" font-weight="700" fill="#0b0b0b">10</text>

  <!-- Row 3: tree-sitter baseline = 14 -> width 392 -->
  <text x="238" y="191" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">tree-sitter grammars</text>
  <text x="238" y="205" font-size="10.5" fill="#8a8983" text-anchor="end">plain libFuzzer (no LLM)</text>
  <rect x="250" y="179" width="392" height="26" rx="4" fill="#eb6834"/>
  <text x="654" y="197" font-size="13" font-weight="700" fill="#0b0b0b">14</text>
</svg>
