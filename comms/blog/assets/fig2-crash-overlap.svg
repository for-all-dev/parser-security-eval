<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="719" height="257" rx="10" fill="#fcfcfb" stroke="#e6e5e1"/>

  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Which crashes each method found</text>
  <text x="28" y="54" font-size="12.5" fill="#52514e">18 distinct memory-safety crashes across 9 tree-sitter grammars, same walltime.</text>

  <!-- legend -->
  <rect x="452" y="24" width="11" height="11" rx="2.5" fill="#2a78d6"/>
  <text x="468" y="33" font-size="11.5" fill="#52514e">found by both</text>
  <rect x="560" y="24" width="11" height="11" rx="2.5" fill="#eb6834"/>
  <text x="576" y="33" font-size="11.5" fill="#52514e">found by only this method</text>

  <!-- gridlines 0,5,10,15 ; x = 250 + v*28 -->
  <g stroke="#ededea" stroke-width="1">
    <line x1="250" y1="82" x2="250" y2="188"/>
    <line x1="390" y1="82" x2="390" y2="188"/>
    <line x1="530" y1="82" x2="530" y2="188"/>
    <line x1="670" y1="82" x2="670" y2="188"/>
  </g>
  <g font-size="10.5" fill="#8a8983" text-anchor="middle">
    <text x="250" y="204">0</text>
    <text x="390" y="204">5</text>
    <text x="530" y="204">10</text>
    <text x="670" y="204">15</text>
  </g>
  <text x="460" y="226" font-size="11" fill="#8a8983" text-anchor="middle">distinct memory-safety crashes</text>
  <line x1="250" y1="82" x2="250" y2="188" stroke="#c9c8c4" stroke-width="1.5"/>

  <!-- Row 1: Hybrid = shared 6 (168) + hybrid-only 4 (112) = 10 -->
  <text x="238" y="104" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">hybrid</text>
  <text x="238" y="118" font-size="10.5" fill="#8a8983" text-anchor="end">LLM in loop</text>
  <rect x="250" y="92" width="168" height="26" rx="4" fill="#2a78d6"/>
  <text x="334" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="422" y="92" width="112" height="26" rx="4" fill="#eb6834"/>
  <text x="478" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="546" y="110" font-size="13" font-weight="700" fill="#0b0b0b">10</text>

  <!-- Row 2: Baseline = shared 6 (168) + baseline-only 8 (224) = 14 -->
  <text x="238" y="152" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">plain libFuzzer</text>
  <text x="238" y="166" font-size="10.5" fill="#8a8983" text-anchor="end">no LLM</text>
  <rect x="250" y="140" width="168" height="26" rx="4" fill="#2a78d6"/>
  <text x="334" y="157" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="422" y="140" width="224" height="26" rx="4" fill="#eb6834"/>
  <text x="534" y="157" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
  <text x="658" y="158" font-size="13" font-weight="700" fill="#0b0b0b">14</text>

  <text x="28" y="246" font-size="11.5" fill="#52514e">The bare fuzzer reproduced 6 of the hybrid's 10, and found 8 the hybrid missed &#8212; its exclusive set is double the hybrid's.</text>
</svg>
